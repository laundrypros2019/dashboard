<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F&amp;F Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f4; --card: #ffffff; --text: #111111; --muted: #6b6a66; --line: #e6e4de;
    --red-bg: #fcebeb; --red: #791f1f; --green-bg: #e1f5ee; --green: #085041;
    --pink-bg: #fbeaf0; --pink: #72243e; --blue-bg: #e6f1fb; --blue: #0c447c;
    --amber-bg: #faeeda; --amber: #633806; --ok: #0f6e56; --brand-bg: #000000; --brand: #000000;
  }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --card: #1d1d1d; --text: #f4f4f4; --muted: #a9a79f; --line: #34332f;
      --red-bg: #501313; --red: #f7c1c1; --green-bg: #04342c; --green: #9fe1cb;
      --pink-bg: #4b1528; --pink: #f4c0d1; --blue-bg: #042c53; --blue: #b5d4f4;
      --amber-bg: #412402; --amber: #fac775; --ok: #5dcaa5; --brand-bg: #000000; --brand: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 Arimo, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .bar { background: #000; color: #fff; }
  .bar div { max-width: 520px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar a { color: #fff; text-decoration: none; }
  .bar .home { flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #fff;
    display: flex; align-items: center; justify-content: center; }
  .bar .home img { height: 30px; display: block; }
  .bar .word { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .bar .word img { height: 20px; width: auto; max-width: 100%; display: block; filter: invert(1); }
  .bar .word span { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.8; }
  .bar .back { margin-left: auto; font-size: 14px; font-weight: 600; white-space: nowrap; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 32px; }
  .hello { margin-bottom: 16px; }
  h1 { font-size: 21px; margin: 0; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 104px; border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 15px;
    text-align: center; padding: 14px 8px; -webkit-tap-highlight-color: transparent;
    background: var(--card); color: var(--text); border: 1.5px solid var(--text); }
  .tile:active { transform: scale(0.97); background: var(--text); color: var(--card); }
  .tile .icon { font-size: 30px; line-height: 1; }
  .tile .icon svg { display: block; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-top: 16px; border: 1px solid var(--line); }
  .card h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 .more { float: right; font-size: 13px; font-weight: 600; color: var(--muted); }
  .vehicle + .vehicle { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .vehicle h3 { font-size: 14px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
  .van { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .pill.OK { background: var(--green-bg); color: var(--green); }
  .pill.Due { background: var(--amber-bg); color: var(--amber); }
  .pill.Overdue { background: var(--red-bg); color: var(--red); }
  .item { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .check { color: var(--ok); font-size: 18px; line-height: 1.2; flex: none; }
  .item .t { font-size: 14px; font-weight: 500; }
  .count { font-weight: 400; color: var(--muted); font-size: 13px; }
  .dot { color: var(--red); font-size: 18px; line-height: 1.2; flex: none; }
  .item .n { font-size: 13px; color: var(--muted); }
  .empty { font-size: 14px; color: var(--muted); }
  .item .grow { flex: 1; min-width: 0; }
  .openRow + .openRow { border-top: 1px solid var(--line); }
  .openRow .item { border-top: 0; }
  .closeBtn { flex: none; align-self: center; font: 600 13px Arimo, sans-serif; padding: 7px 12px; border-radius: 999px;
    background: var(--card); color: var(--text); border: 1.5px solid var(--text); }
  .closeBtn:active { background: var(--text); color: var(--card); }
  .closer { margin: 0 0 12px 28px; padding: 12px; border-radius: 12px; background: var(--bg); }
  .closer label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .closer select, .closer input { display: block; width: 100%; margin-top: 4px; font: 16px Arimo, sans-serif; padding: 9px 10px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .closer .cBtns { display: flex; gap: 8px; }
  .closer button { font: 700 15px Arimo, sans-serif; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--text); }
  .closer .cSave, .closer .cmSave { background: var(--text); color: var(--card); flex: 1; }
  .closer .cCancel { background: var(--card); color: var(--text); }
  .closer .cMsg { font-size: 13px; color: var(--red); margin-top: 8px; }
  .closer .cMsg:empty { display: none; }
  .closer textarea { display: block; width: 100%; margin-top: 4px; font: 16px Arimo, sans-serif; padding: 9px 10px; min-height: 70px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); resize: vertical; }
  .rowBtns { flex: none; align-self: center; display: flex; flex-direction: column; gap: 6px; }
  .openRow .item.tap { cursor: pointer; }
  .detail { margin: 0 0 12px 28px; padding: 12px; border-radius: 12px; background: var(--bg); font-size: 14px; }
  .detail .dDesc { white-space: pre-wrap; margin-bottom: 10px; }
  .detail h4 { font-size: 13px; margin: 0 0 6px; color: var(--muted); }
  .detail .cm + .cm { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .detail .cm .n { font-size: 12px; color: var(--muted); }
  .links a { display: flex; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 15px; }
  .links a:first-of-type { border-top: 0; }
  .links a span { color: var(--muted); }
  .cal { margin-top: 0; }
  .cal .day { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; }
  .cal .day:first-child { margin-top: 0; }
  .cal .tag { font-size: 11px; font-weight: 600; border: 1px solid var(--text); border-radius: 999px; padding: 1px 7px; margin-left: 4px; white-space: nowrap; }
  .cal .time { font-size: 13px; color: var(--muted); width: 128px; flex: none; }
  .lock label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .lock input { display: block; width: 100%; margin-top: 6px; font: 22px Arimo, sans-serif; letter-spacing: 0.3em; text-align: center;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .lock button { width: 100%; font: 700 16px Arimo, sans-serif; padding: 12px 16px; border-radius: 10px;
    border: 1.5px solid var(--text); background: var(--text); color: var(--card); }
  .lock .lMsg { font-size: 13px; color: var(--red); margin-top: 10px; }
  .lock .lMsg:empty { display: none; }
  .person { padding: 10px 0; border-top: 1px solid var(--line); }
  .person:first-of-type { border-top: 0; }
  .person .t { font-size: 15px; font-weight: 600; }
  .person .role { font-weight: 400; color: var(--muted); }
  .person .reach { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 3px; font-size: 14px; }
  .person .reach a { color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
  .mSearch { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; margin-top: 8px; }
  .mSearch input { display: block; width: 100%; font: 16px Arimo, sans-serif; padding: 11px 12px; border-radius: 12px;
    border: 1.5px solid var(--text); background: var(--card); color: var(--text); }
  .mSearch .mBar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .mSearch .mBar span { flex: 1; }
  .mSearch .mBar button { font: 600 13px Arimo, sans-serif; padding: 6px 12px; border-radius: 999px;
    background: var(--card); color: var(--text); border: 1.5px solid var(--text); }
  .mHits { margin-top: 4px; }
  .mHit { display: block; width: 100%; text-align: left; font: 14px/1.4 Arimo, sans-serif; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .mHit b { display: block; font-size: 13px; margin-bottom: 2px; }
  .links a.mHit { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }
  .links a.mHit small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  #sopSearch, #vidSearch { position: static; margin: 0 0 10px; padding-top: 0; }
  .vid { border-top: 1px solid var(--line); }
  .vid:first-child { border-top: 0; }
  .vid > button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 0; font: 15px Arimo, sans-serif;
    color: var(--text); background: none; border: 0; text-align: left; cursor: pointer; }
  .vid > button span { margin-left: auto; color: var(--muted); }
  .vid .frame { position: relative; aspect-ratio: 16 / 9; margin-bottom: 12px; border-radius: 12px; overflow: hidden; background: #000; }
  /* The playing video sizes to the screen it's on (Mike, 2026-11-25): it grows
     past the page column, as big as fits — the screen width less a small edge,
     up to its real 1280 px and 80% of the screen height — centered. */
  .vid .frame { width: min(100vw - 24px, 1280px, calc(80vh * 16 / 9)); left: 50%; transform: translateX(-50%); }
  .vid .frame video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .mHit mark { background: #ffe066; color: #111; border-radius: 3px; }
  .manual { padding: 0; overflow: hidden; }
  .manual iframe { display: block; width: 100%; height: 70vh; border: 0; background: #fff; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
</style>
</head>
<body>
<header class="bar">
  <div>
    <a class="home" id="logo" href="#" aria-label="F&amp;F Dashboard home"><img id="logoIcon" alt=""></a>
    <a class="word" id="logoLink" href="#"><img id="logoWord" alt="Fluff and Fold"><span>Dashboard</span></a>
    <a class="back" id="back" href="#" hidden>‹ Home</a>
  </div>
</header>
<main>
  <div class="hello">
    <h1 id="greet">Hi, team</h1>
    <div class="sub" id="sub"></div>
  </div>

  <!-- The staff code (HUB_CODE in StaffHub.js): asked once, then remembered on this phone. -->
  <section class="card lock" id="lockPage" hidden>
    <form id="lockForm">
      <label>Staff code<input id="lockCode" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></label>
      <button type="submit">Open dashboard</button>
      <div class="lMsg" id="lockMsg"></div>
    </form>
  </section>

  <div id="homePage" hidden>
  <nav class="tiles" id="tiles" aria-label="What do you need to do?"></nav>

  <section class="card" id="vanCard" hidden>
    <h2>🚐 Vehicles</h2>
    <div id="vehicles"></div>
  </section>

  <!-- Home shows 3 of each; the titles open ?page=open / ?page=handled,
       which reuse these cards with the full list. -->
  <section class="card" id="openCard">
    <h2 id="openHead"><a id="openLink" href="#">🚩 Open Issues <span class="count" id="openCount"></span>
      <span class="more">See all ›</span></a></h2>
    <div id="open"></div>
  </section>

  <section class="card" id="recentCard">
    <h2 id="recentHead"><a id="recentLink" href="#">✅ Recently Handled <span class="more">See all ›</span></a></h2>
    <div id="recent"></div>
  </section>

  <!-- Phone messages have their own two lists (?page=calls / callsHandled). -->
  <section class="card" id="callsOpenCard">
    <h2 id="callsOpenHead"><a id="callsOpenLink" href="#">☎️ Open Phone Messages <span class="count" id="callsOpenCount"></span>
      <span class="more">See all ›</span></a></h2>
    <div id="callsOpen"></div>
  </section>

  <section class="card" id="callsRecentCard">
    <h2 id="callsRecentHead"><a id="callsRecentLink" href="#">✅ Recently Handled Phone Messages <span class="more">See all ›</span></a></h2>
    <div id="callsRecent"></div>
  </section>

  </div>

  <section class="card links" id="linksPage" hidden>
    <div id="links"></div>
  </section>

  <section class="card links" id="sopsPage" hidden>
    <!-- One search over all the SOPs; a result opens that SOP at that spot. -->
    <div class="mSearch" id="sopSearch">
      <input id="sopQ" type="search" placeholder="Search all SOPs (like: tablecloth)" autocomplete="off" enterkeyhint="search">
      <div class="mBar" id="sopBar" hidden><span id="sopCount"></span></div>
      <div class="mHits" id="sopHits"></div>
    </div>
    <div id="sops"></div>
  </section>

  <!-- Folding Videos (Mike, 2026-11-24): search, then tap one to play it here. -->
  <section class="card links" id="videosPage" hidden>
    <div class="mSearch" id="vidSearch">
      <input id="vidQ" type="search" placeholder="Search (like: pants)" autocomplete="off" enterkeyhint="search">
      <div class="mBar" id="vidBar" hidden><span id="vidCount"></span></div>
    </div>
    <div id="videos"></div>
  </section>

  <section class="card cal" id="calendarPage" hidden></section>

  <nav class="tiles" id="reportPage" aria-label="What kind of issue?" hidden></nav>

  <section class="card" id="staffPage" hidden><div id="staffList"></div></section>

  <!-- Search the manual: stays at the top while scrolling. -->
  <div class="mSearch" id="manualSearch" hidden>
    <input id="manualQ" type="search" placeholder="Search the manual (like: piercings)" autocomplete="off" enterkeyhint="search">
    <div class="mBar" id="manualBar" hidden><span id="manualCount"></span>
      <button type="button" id="manualPrev" aria-label="Previous">‹</button>
      <button type="button" id="manualNext" aria-label="Next">›</button>
      <button type="button" id="manualList">List</button></div>
  </div>
  <div class="mHits" id="manualHits"></div>

  <!-- The manual's Google Doc, shown with scripts off (sandbox) so it can't run anything. -->
  <section class="card manual" id="manualPage" hidden>
    <iframe id="manualFrame" title="Employee Manual" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </section>

  <footer>F&amp;F Dashboard · Fluff &amp; Fold Modesto · questions? Ask Mike</footer>
</main>

<script>
  var el = function (id) { return document.getElementById(id) };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  };
  var fmt = function (n) { return Math.round(n).toLocaleString('en-US') };

  // Fills the page from the hub data (see hubData_ in StaffHub.js).
  function render(data) {

  el('logoIcon').src = data.logos.icon;
  el('logoWord').src = data.logos.horizontal;
  el('logo').href = data.home;
  el('logoLink').href = data.home;
  el('back').href = data.home;
  el('openLink').href = data.home + '?page=open';
  el('recentLink').href = data.home + '?page=handled';
  el('callsOpenLink').href = data.home + '?page=calls';
  el('callsRecentLink').href = data.home + '?page=callsHandled';
  el('homePage').hidden = false;
  var subPages = { report: '🚩 Report an Issue', staff: '📇 Employee Contacts', manual: '📘 Employee Manual', sops: '📋 SOPs', videos: '🎥 Folding Videos', links: '🔗 Links', calendar: '📅 Company Calendar', open: '🚩 Open Issues',
    handled: '✅ Recently Handled', calls: '☎️ Open Phone Messages', callsHandled: '✅ Recently Handled Phone Messages' };
  // One SOP (?page=sop-<key>) shows like the manual, under its own title.
  var sopDoc = /^sop-/.test(data.page);
  if (sopDoc) subPages[data.page] = data.docTitle || '📋 SOP';
  if (subPages[data.page]) {
    el('back').hidden = false;
    el('greet').textContent = subPages[data.page];
    el('sub').textContent = 'Tap the logo to go home';
  }
  if (data.page === 'links' || data.page === 'calendar' || data.page === 'report' || data.page === 'staff' || data.page === 'manual' || data.page === 'sops' || data.page === 'videos' || sopDoc) {
    el('homePage').hidden = true;
    el((sopDoc ? 'manual' : data.page) + 'Page').hidden = false;
  }
  if (data.page === 'sops') { el('sub').textContent = 'Search them all, or tap one to read it'; sopSearch(data) }
  if (data.page === 'videos') { el('sub').textContent = 'Search, then tap a video to play it'; videoList(data) }
  pendingFind = sopDoc && data.find && data.find.q ? data.find : null;
  if (sopDoc) manualName = data.docTitle || 'SOP';
  if (sopDoc) el('manualQ').placeholder = 'Search this SOP';
  if (data.page === 'report') el('sub').textContent = 'What kind of issue? Tap one.';
  // The list pages keep only their own card, with the whole list.
  var calls = data.calls || { open: [], recent: [], openCount: 0 };
  var listCards = { open: 'open', handled: 'recent', calls: 'callsOpen', callsHandled: 'callsRecent' };
  var listPage = !!listCards[data.page];
  if (listPage) {
    el('tiles').hidden = true;
    Object.keys(listCards).forEach(function (pg) {
      var id = listCards[pg];
      el(id + 'Head').hidden = true;
      if (pg !== data.page) el(id + 'Card').hidden = true;
    });
    if (data.page === 'open') el('sub').textContent = (data.openCount || 0) + ' open · tap Close when one is handled';
    if (data.page === 'handled') el('sub').textContent = 'The last ' + data.recent.length + ' closed issues';
    if (data.page === 'calls') el('sub').textContent = (calls.openCount || 0) + ' open · tap Close when one is handled';
    if (data.page === 'callsHandled') el('sub').textContent = 'The last ' + calls.recent.length + ' handled phone messages';
  }
  if (data.page === 'staff') {
    var people = data.staffList;
    el('staffList').innerHTML = !people ? '<div class="empty">The list couldn\'t load. Try again in a minute, or ask Mike.</div>' :
      people.map(function (s) {
        var reach = [];
        if (s.mobile) reach.push('<a href="tel:' + esc(s.mobile.replace(/[^\d+]/g, '')) + '">📞 ' + esc(s.mobile) + '</a>');
        if (s.email) reach.push('<a href="mailto:' + esc(s.email) + '">✉️ ' + esc(s.email) + '</a>');
        return '<div class="person"><div class="t">' + esc(s.name) + (s.role ? ' <span class="role">- ' + esc(s.role) + '</span>' : '') +
          '</div><div class="reach">' + reach.join('') + '</div></div>';
      }).join('');
    if (people) el('sub').textContent = people.length + ' people · tap a number to call';
  }
  if (data.page === 'manual' || sopDoc) {
    var frame = el('manualFrame');
    if (!data.manual) {
      el('manualPage').classList.remove('manual');
      el('manualPage').innerHTML = '<div class="empty">' + (sopDoc ? 'This SOP' : 'The manual') + ' couldn\'t load. Try again in a minute, or ask Mike.</div>';
    } else {
      el('sub').textContent = 'Always the latest version · tap the logo to go home';
      // Fit the doc to a phone; links open in a new tab.
      var fit = '<base target="_blank"><style>body{max-width:none!important;margin:0!important;padding:16px!important}' +
        'img{max-width:100%!important;height:auto!important}table{max-width:100%!important}' +
        'mark{background:#ffe066;color:inherit;border-radius:2px}mark.now{background:#ff9f1c}' +
        '.ffToc{border:1px solid #ddd;border-radius:12px;padding:12px 14px;margin:0 0 20px;font-family:Arimo,Arial,sans-serif}' +
        '.ffToc summary{font-weight:700;font-size:16px;cursor:pointer}' +
        '.ffToc a{display:block;padding:8px 0;border-top:1px solid #eee;color:#111;text-decoration:none;font-size:15px;line-height:1.3}' +
        '.ffToc summary+a{margin-top:10px}.ffToc a.l1{font-weight:700}.ffToc a.l2{padding-left:14px}' +
        '.ffToc a.l3{padding-left:28px;font-size:14px;color:#555}</style>';
      var fitHeight = function () {
        try { frame.style.height = (frame.contentDocument.documentElement.scrollHeight + 20) + 'px' } catch (e) {}
      };
      frame.onload = function () {
        try {
          tidyManual(frame, fitHeight);
          manualSearch(frame);
        } catch (e) {}
        fitHeight();
      };
      frame.srcdoc = /<head[^>]*>/i.test(data.manual) ? data.manual.replace(/<head[^>]*>/i, function (h) { return h + fit }) : fit + data.manual;
    }
  }
  if (data.page === 'calendar') {
    var cal = data.calendar;
    el('calendarPage').innerHTML = !cal ? '<div class="empty">The calendar couldn\'t load. Try again in a minute, or ask Mike.</div>' :
      !cal.days.length ? '<div class="empty">Nothing on the calendar through ' + esc(cal.through) + '.</div>' :
      cal.days.map(function (d) {
        return '<div class="day">' + esc(d.day) + '</div>' + d.events.map(function (ev) {
          // Each calendar's color from Google Calendar (only a #hex color is used).
          var c = /^#[0-9a-f]{3,8}$/i.test(ev.color || '') ? ' style="color:' + ev.color + ';border-color:' + ev.color + '"' : '';
          return '<div class="item"><span class="time">' + esc(ev.time) + '</span><div><div class="t"' + c + '>' + esc(ev.title) +

  function tidyManual(frame, fitHeight) {
    var doc = frame.contentDocument;

      toc[0].parentNode.insertBefore(box, toc[0]);
      toc.forEach(function (p) { p.remove() });

  // Search the manual (Mike, 2026-11-04). A small spelling slip still finds
  // the word ("peircings" finds "piercings"). Each place it's found is listed
  // with its section; tapping one scrolls the manual there. The table of
  // contents is skipped, so results are the real sections.
  var STOP = ['the', 'a', 'an', 'and', 'or', 'of', 'to', 'in', 'on', 'for', 'is', 'are', 'what', 'can', 'i', 'my', 'do', 'about'];
  // Word matching shared by the manual/SOP search and the all-SOPs search.
  var norm = function (w) { return w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') };
  var words = function (t) { return t.match(/[A-Za-z0-9\u00C0-\u024F']+/g) || [] };
  // Letters added, dropped, changed or swapped (so "ei" for "ie" counts as 1).
  var dist = function (a, b) {
    var d = [], i, j;
    for (i = 0; i <= a.length; i++) d[i] = [i];
    for (j = 0; j <= b.length; j++) d[0][j] = j;
    for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[a.length][b.length];
  };
  // How many slips a word can have: 1, or 2 for long words (so "pricing" doesn't match "peircings").
  var slip = function (q) { return q.length >= 10 ? 2 : q.length >= 4 ? 1 : 0 };
  var matches = function (word, q) {
    var w = norm(word);
    if (w === q || (q.length >= 3 && w.indexOf(q) === 0)) return true;
    var max = slip(q);
    if (!max) return false;
    if (Math.abs(w.length - q.length) <= max && dist(w, q) <= max) return true;
    var sw = w.replace(/s$/, ''), sq = q.replace(/s$/, '');
    if (Math.abs(sw.length - sq.length) <= max && dist(sw, sq) <= max) return true;
    return q.length >= 5 && w.length > q.length && dist(w.slice(0, q.length), q) <= 1; // a word still being typed
  };

  var pendingFind = null; // { q, hit } from an all-SOPs search result
  var manualName = 'Employee Manual'; // the doc's name on search results

  // The SOPs page search: every SOP's paragraphs (data.sopIndex), same word
  // matching as the manual. Tapping a result opens that SOP at that paragraph.
  function sopSearch(data) {
    var index = data.sopIndex || [], timer = null;

    var run = function () {
      var raw = el('sopQ').value.trim();

      el('sopBar').hidden = !terms.length;
      el('sops').hidden = !!terms.length;
      if (!terms.length) { el('sopHits').innerHTML = ''; return }
      var hits = [];
      index.forEach(function (d) {

        var html = esc(snip);

        return '<a class="mHit" href="' + esc(url) + '"><small>' + esc(h.d.icon + ' ' + h.d.label) + '</small>' +
          (h.section && h.section !== t ? '<b>' + esc(h.section) + '</b>' : '') + html + '</a>';

    };
    el('sopQ').oninput = function () { clearTimeout(timer); timer = setTimeout(run, 300) };

  // The Folding Videos page: every video in a list; typing filters it (title

        (sure ? exact : near).push(box);

      var byIndex = function (a, b) { return a.getAttribute('data-i') - b.getAttribute('data-i') };

  function manualSearch(frame) {
    var doc = frame.contentDocument;
    // Each paragraph and its section heading, in reading order (no table of contents).
    var blocks = [], section = '';
    Array.prototype.forEach.call(doc.body.querySelectorAll('h1, h2, h3, h4, p, li'), function (b) {
      var text = b.textContent.replace(/\s+/g, ' ').trim();
      if (!text) return;
      if (/^H[1-4]$/.test(b.tagName)) section = text;
      if (b.querySelector('a[href^="#"]')) return;
      blocks.push({ el: b, text: text, section: section });
    });

    var marks = [], at = -1, timer = null;
    var clear = function () {
      marks.forEach(function (m) {
        var parent = m.parentNode;
        if (!parent) return;
        parent.replaceChild(doc.createTextNode(m.textContent), m);
        parent.normalize();

      marks = [];
      at = -1;

    // Wraps the found words of one paragraph in <mark>; returns the first one.
    var markWords = function (b, found) {
      var first = null, walker = doc.createTreeWalker(b, NodeFilter.SHOW_TEXT), nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        var parts = node.nodeValue.split(/([A-Za-z0-9\u00C0-\u024F']+)/);
        if (!parts.some(function (p) { return found[p] })) return;
        var frag = doc.createDocumentFragment();
        parts.forEach(function (p) {

            var m = doc.createElement('mark');
            m.textContent = p;
            frag.appendChild(m);
            if (!first) first = m;
          } else if (p) frag.appendChild(doc.createTextNode(p));
        });
        node.parentNode.replaceChild(frag, node);
      });
      return first;
    };
    var lastHits = [];
    var go = function (i, instant) {
      if (!marks.length) return;
      at = (i + marks.length) % marks.length;
      marks.forEach(function (m, k) { m.className = k === at ? 'now' : '' });
      var top = frame.getBoundingClientRect().top + window.scrollY + marks[at].getBoundingClientRect().top;
      window.scrollTo({ top: Math.max(0, top - el('manualSearch').offsetHeight - 40), behavior: instant ? 'auto' : 'smooth' });
      el('manualCount').textContent = 'Place ' + (at + 1) + ' of ' + marks.length;
    };
    var run = function () {
      clear();
      var raw = el('manualQ').value.trim();
      var terms = words(raw).map(norm);
      var kept = terms.filter(function (t) { return STOP.indexOf(t) < 0 });
      if (kept.length) terms = kept;
      el('manualBar').hidden = !terms.length;
      if (!terms.length) { el('manualHits').innerHTML = ''; return }
      var hits = [];
      blocks.forEach(function (b) {
        var found = {}, all = terms.every(function (q) {
          var any = false;
          words(b.text).forEach(function (w) { if (matches(w, q)) { found[w] = true; any = true } });
          return any;
        });

        var mark = markWords(b.el, found);
        if (!mark) return;
        marks.push(mark);
        hits.push({ b: b, found: found });
      });
      lastHits = hits;
      el('manualCount').textContent = hits.length ? hits.length + (hits.length === 1 ? ' place' : ' places') + ' found · tap one' :
        'Nothing found for "' + raw + '". Try another word.';
      el('manualHits').innerHTML = hits.slice(0, 40).map(function (h, i) {
        var t = h.b.text, first = t.length;
        Object.keys(h.found).forEach(function (w) { var k = t.indexOf(w); if (k >= 0 && k < first) first = k });
        var start = Math.max(0, first - 50), snip = (start ? '…' : '') + t.slice(start, start + 150) + (start + 150 < t.length ? '…' : '');
        var html = esc(snip);
        Object.keys(h.found).forEach(function (w) {
          html = html.replace(new RegExp('(^|[^A-Za-z0-9])(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[^A-Za-z0-9]|$)', 'g'), '$1<mark>$2</mark>');
        });
        return '<button type="button" class="mHit" data-i="' + i + '"><b>' + esc(h.b.section || manualName) + '</b>' + html + '</button>';
      }).join('');
    };
    el('manualSearch').hidden = false;
    el('manualQ').oninput = function () { clearTimeout(timer); timer = setTimeout(run, 300) };
    el('manualQ').onkeydown = function (ev) { if (ev.key === 'Enter') { clearTimeout(timer); run(); el('manualQ').blur() } };
    el('manualHits').onclick = function (ev) {
      var b = ev.target.closest && ev.target.closest('.mHit');
      if (b) go(+b.getAttribute('data-i'));
    };
    el('manualPrev').onclick = function () { go(at - 1) };
    el('manualNext').onclick = function () { go(at + 1) };
    el('manualList').onclick = function () { window.scrollTo({ top: el('manualHits').offsetTop - el('manualSearch').offsetHeight - 20, behavior: 'smooth' }) };
    // Opened from the all-SOPs search: search the same words, jump to that paragraph.
    if (pendingFind) {
      var want = pendingFind.hit;
      el('manualQ').value = pendingFind.q;
      pendingFind = null;
      run();
      var idx = -1;
      lastHits.forEach(function (h, k) { if (idx < 0 && want && h.b.text.indexOf(want) === 0) idx = k });
      // Again after pictures load and the page grows, so it lands on the spot.
      [300, 1200, 2500].forEach(function (ms) { setTimeout(function () { go(Math.max(idx, 0), true) }, ms) });
    }
  }

  // The staff code: asked once, then kept on this phone. Every request sends
  // it, and the server (doPost in StaffHub.js) sends nothing back without it.
  var CODE_KEY = 'ffDashboardCode';
  var staffCode = '';
  var savedCode = function () { try { return localStorage.getItem(CODE_KEY) || '' } catch (e) { return '' } };
  var keepCode = function (c) { try { c ? localStorage.setItem(CODE_KEY, c) : localStorage.removeItem(CODE_KEY) } catch (e) {} };

  // shell: { page, home, api, logos }. Loads the page's data with the code, then renders it.
  function start(shell, code) {
    el('logoIcon').src = shell.logos.icon;
    el('logoWord').src = shell.logos.horizontal;
    el('logo').href = shell.home;
    el('logoLink').href = shell.home;
    code = code || savedCode();
    if (!code) return showLock(shell, '');
    el('lockPage').hidden = true;
    el('greet').textContent = 'Loading…';
    el('sub').textContent = '';
    fetch(shell.api, { method: 'POST', credentials: 'omit', body: JSON.stringify({ action: 'data', page: shell.page, code: code }) })
      .then(function (r) { return r.json() })
      .then(function (data) {
        if (data.locked) { keepCode(''); return showLock(shell, 'That code didn\'t work. Try again, or ask Mike.') }
        keepCode(code);
        staffCode = code;
        data.home = shell.home;
        data.api = shell.api;
        data.logos = shell.logos;
        data.tiles.forEach(function (t) { if (t.page) t.url = shell.home + '?page=' + t.page });
        data.find = { q: shell.q || '', hit: shell.hit || '' };
        render(data);
      })
      .catch(function () {
        el('greet').textContent = 'Couldn\'t load';
        el('sub').textContent = 'Check your internet, then pull down to refresh. Still stuck? Ask Mike.';
      });
  }

  function showLock(shell, msg) {
    el('homePage').hidden = true;
    el('lockPage').hidden = false;
    el('greet').textContent = 'F&F Dashboard';
    el('sub').textContent = 'Type the staff code to open it.';
    el('lockMsg').textContent = msg;
    el('lockCode').value = '';
    el('lockForm').onsubmit = function (ev) {
      ev.preventDefault();
      var c = el('lockCode').value.trim();
      if (c) start(shell, c);
    };
    el('lockCode').focus();
  }

  // BOOT (the GitHub Pages copy swaps this line; see scripts/build-dashboard-site.js)
  start({
    page: new URLSearchParams(location.search).get('page') || 'home',
    q: new URLSearchParams(location.search).get('q') || '',
    hit: new URLSearchParams(location.search).get('hit') || '',
    home: location.pathname,
    api: 'https://script.google.com/macros/s/AKfycbwBED66CPc7nq88izmLWR3fc0xEcIVlJCgpNkKH-bjVWhGW177NfU2h8xggpDWfjPGy/exec',
    logos: { icon: 'logo-icon.png', horizontal: 'logo-horizontal.png' },
  });
</script>
